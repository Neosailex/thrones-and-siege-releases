<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrones &amp; Siege</title>
<!-- Launcher actualizable: vive en app/launcher/ del juego, así los cambios visuales llegan con cada actualización.
     Lo carga main.cjs (app://game/launcher/index.html); si falla, usa el empaquetado y después desktop/launcher.html. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'">
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 700; src: url("../fonts/cinzel-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: 'Cinzel'; font-weight: 900; src: url("../fonts/cinzel-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: 'Alegreya Sans'; font-weight: 500; src: url("../fonts/alegreya-sans-latin-500-normal.woff2") format("woff2"); }
  :root {
    --gold: #e2b45a; --gold2: #ffd98a; --ink: #f1e4c8; --dim: #c3b291;
    --f-title: 'Cinzel', Georgia, serif; --f-text: 'Alegreya Sans', 'Segoe UI', Tahoma, sans-serif;
    --z: 1; --bar: 142px;
  }
  * { box-sizing: border-box; }
  html { zoom: var(--z); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0907; color: var(--ink); font: 500 16px/1.4 var(--f-text); user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; }

  /* ---------- fondo vivo ---------- */
  .bg { position: fixed; inset: 0; overflow: hidden; background: #140d10 url("../ui2/menu_fondo_completo.webp") center/cover no-repeat; }
  .bg video { position: absolute; inset: -2%; width: 104%; height: 104%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
  .bg video.on { opacity: 1; }
  .bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .vig { position: fixed; inset: 0; pointer-events: none; background:
    radial-gradient(ellipse 80% 75% at 60% 42%, transparent 40%, rgba(6,3,4,.78) 100%),
    linear-gradient(90deg, rgba(8,5,4,.78), rgba(8,5,4,.35) 34%, transparent 55%),
    linear-gradient(180deg, rgba(6,4,6,.55), transparent 16%, transparent 62%, rgba(5,3,2,.92)); }

  /* ---------- barra de título propia (ventana sin marco) ---------- */
  .tb { position: fixed; left: 0; right: 0; top: 0; height: 36px; z-index: 20; display: flex; align-items: center; padding: 0 6px 0 14px; -webkit-app-region: drag;
    background: linear-gradient(180deg, rgba(10,6,5,.85), rgba(10,6,5,0)); }
  .tb .ttl { font: 700 12px var(--f-title); letter-spacing: .16em; color: #bfa77a; text-transform: uppercase; text-shadow: 0 1px 2px #000; }
  .tb .sp { flex: 1; }
  .tb button { -webkit-app-region: no-drag; width: 40px; height: 28px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; border-radius: 4px; transition: background .12s; }
  .tb button svg { width: 14px; height: 14px; stroke: #d9be86; stroke-width: 1.8; fill: none; filter: drop-shadow(0 1px 1px #000); }
  .tb button:hover { background: rgba(226,180,90,.18); }
  .tb button.x:hover { background: #8a1d12; }
  .tb button.x:hover svg { stroke: #fff; }
  .tb.native { display: none; }

  /* ---------- logo ---------- */
  main { position: fixed; inset: 36px 0 0 0; }
  .logo { position: absolute; left: 58px; top: 26px; }
  .logo h1 { margin: 0; font: 900 66px/1 var(--f-title); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap;
    background: linear-gradient(180deg, #fffbe6 0%, #fbe39a 18%, #e9b65a 40%, #a8691f 49%, #6e410f 52%, #b9822f 60%, #f2cb72 80%, #fff0c0 90%, #a8742a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1.2px rgba(70,38,8,.9); filter: drop-shadow(0 -1px 0 rgba(255,244,205,.55)) drop-shadow(0 2px 0 #3a2007) drop-shadow(0 4px 3px #000c) drop-shadow(0 0 26px rgba(255,180,80,.32)); }
  .logo h1 .amp { font-size: .6em; vertical-align: .2em; font-weight: 700; }
  .logo .tag { margin: 8px 0 0 4px; font-size: 18px; font-style: italic; color: #e8d9bb; text-shadow: 0 1px 3px #000, 0 0 10px #000; }
  .logo .ver { display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 0 4px; font: 700 12px var(--f-title); letter-spacing: .14em; color: #d9c08a; text-transform: uppercase; text-shadow: 0 1px 2px #000; }
  .logo .ver i { width: 7px; height: 7px; border-radius: 50%; background: #7fd16a; box-shadow: 0 0 8px #7fd16a; }
  .logo .ver.old i { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .logo .ver.off i { background: #9a8a6e; box-shadow: none; }

  /* ---------- novedades ---------- */
  .news { position: absolute; left: 50px; top: 214px; width: 500px; max-height: calc(800px - 36px - 214px - var(--bar) - 22px); display: flex; flex-direction: column;
    border: 40px solid transparent; border-image: url("../ui2/ventana_marco_chico.webp") 250 / 40px stretch;
    background: linear-gradient(rgba(20,14,10,.88), rgba(13,9,6,.93)), url("../ui2/textura_piedra.webp") center/420px; background-origin: border-box; filter: drop-shadow(0 18px 26px rgba(0,0,0,.75)); }
  .ribbon { --h: 52px; align-self: center; margin: -36px 0 8px; min-height: var(--h); line-height: var(--h); padding: 0 8px 3px; border-style: solid; border-color: transparent; border-width: 0 49px;
    border-image: url("../ui2/cinta_titulo.webp") 0 250 fill / 0 49px stretch; font: 700 21px/var(--h) var(--f-title); letter-spacing: .07em; color: #fbe7b5; text-shadow: 0 2px 0 #3a0b06; white-space: nowrap; filter: drop-shadow(0 4px 5px rgba(0,0,0,.6)); }
  .news .body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 12px 4px 6px; scrollbar-width: thin; scrollbar-color: #8a6a3a transparent; user-select: text; -webkit-user-select: text; }
  .news .body::-webkit-scrollbar { width: 6px; } .news .body::-webkit-scrollbar-thumb { background: #8a6a3a; border-radius: 3px; }
  .news ul { margin: 0; padding: 0; list-style: none; }
  .news li { position: relative; padding: 5px 0 5px 22px; color: #eadcbe; font-size: 16px; line-height: 1.35; border-bottom: 1px solid rgba(190,150,80,.12); }
  .news li:last-child { border-bottom: 0; }
  .news li::before { content: ''; position: absolute; left: 3px; top: 12px; width: 8px; height: 8px; rotate: 45deg; background: linear-gradient(135deg, #ffe7a0, #b8862f); box-shadow: 0 0 6px rgba(255,200,100,.5); }
  .news .empty { color: var(--dim); font-style: italic; padding: 6px 2px; }
  .news .sep { height: 1px; margin: 12px auto 8px; width: 72%; background: linear-gradient(90deg, transparent, rgba(226,180,90,.7), transparent); box-shadow: 0 0 8px rgba(226,180,90,.4); }
  .news .foot { text-align: center; font-size: 13.5px; color: #a8977a; }

  /* ---------- barra inferior ---------- */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar); display: flex; align-items: center; gap: 22px; padding: 18px 44px 14px 56px;
    background: linear-gradient(180deg, rgba(24,17,12,.0), rgba(18,12,8,.88) 26%, rgba(12,8,6,.96)); }
  .bar::before { content: ''; position: absolute; left: 0; right: 0; top: 22px; height: 2px; background: linear-gradient(90deg, transparent, rgba(226,180,90,.55) 15%, rgba(226,180,90,.55) 85%, transparent); box-shadow: 0 0 10px rgba(226,180,90,.35); }
  .state { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 12px; }
  .st-top { display: flex; align-items: center; gap: 12px; min-height: 30px; }
  .status { font: 700 18px var(--f-title); letter-spacing: .03em; color: #f6e2ad; text-shadow: 0 1px 3px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status.bad { color: #ffb09f; }
  .detail { font-size: 14.5px; color: #cdb995; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail b { color: var(--gold2); font-weight: 500; font-variant-numeric: tabular-nums; }
  .prog { position: relative; height: 32px; margin-top: 2px; border-style: solid; border-color: transparent; border-width: 0 26px; border-image: url("../ui2/barra_marco.webp") 0 200 fill / 0 28px stretch; padding: 10px 0; opacity: 0; transition: opacity .4s; }
  .prog.on { opacity: 1; }
  .prog:not(.on) { display: none; }
  .prog .trk { position: relative; height: 100%; border-radius: 6px; overflow: visible; }
  .prog .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; background: linear-gradient(180deg, #fff0b8, #e9b85c 45%, #a8721f); box-shadow: 0 0 12px rgba(255,200,100,.7); transition: width .3s ease; overflow: hidden; }
  .prog .fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 0 35%, rgba(255,255,255,.55) 50%, transparent 65% 100%); background-size: 220% 100%; animation: sheen 1.8s linear infinite; }
  .prog.ind .fill { width: 30% !important; animation: indet 1.6s ease-in-out infinite; }
  .prog .knob { position: absolute; top: 50%; left: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; background: url("../ui2/perilla.webp") center/contain no-repeat; filter: drop-shadow(0 2px 3px #000) drop-shadow(0 0 6px rgba(255,200,100,.6)); transition: left .3s ease; }
  .prog.ind .knob { display: none; }
  @keyframes sheen { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  @keyframes indet { 0% { left: -30%; } 100% { left: 100%; } }

  .tools { display: flex; gap: 8px; padding-top: 12px; }
  .g { width: 46px; height: 46px; border: 0; padding: 0; cursor: pointer; background: center/contain no-repeat; filter: drop-shadow(0 3px 4px rgba(0,0,0,.7)); transition: filter .14s, transform .1s; }
  .g:hover, .g:focus-visible { filter: brightness(1.18) drop-shadow(0 0 8px rgba(255,205,110,.75)); outline: none; }
  .g:active { transform: translateY(2px); filter: brightness(.85); }
  .g[aria-pressed="true"] { filter: brightness(1.1) drop-shadow(0 0 7px rgba(255,205,110,.95)); }
  .g-sonido { background-image: url("../ui2/g_sonido.webp"); } .g-mudo { background-image: url("../ui2/g_mudo.webp"); }
  .g-ajustes { background-image: url("../ui2/icono_ajustes.webp"); } .g-carpeta { background-image: url("../ui2/g_registro.webp"); }
  .g-web { background-image: url("../ui2/g_bajar.webp"); } .g-salir { background-image: url("../ui2/icono_salir.webp"); }

  /* botones */
  .btn { --h: 46px; --cap: calc(var(--h) * .93); display: inline-flex; align-items: center; justify-content: center; min-height: var(--h); padding: 0 6px; border-style: solid; border-color: transparent; border-width: 0 var(--cap);
    border-image: url("../ui2/boton_chico.webp") 0 170 fill / 0 var(--cap) stretch; background: none; color: #efe0bd; font: 700 15px var(--f-title); letter-spacing: .04em; cursor: pointer; text-shadow: 0 1px 2px #000;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.6)); transition: filter .14s, transform .08s; white-space: nowrap; }
  .btn:hover, .btn:focus-visible { filter: brightness(1.15) drop-shadow(0 0 7px rgba(255,205,110,.65)); color: var(--gold2); outline: none; }
  .btn:active { transform: translateY(2px); filter: brightness(.88); }
  .btn.retry { --h: 34px; font-size: 13px; display: none; flex: none; }
  .btn.retry.on { display: inline-flex; }

  .play { position: relative; -webkit-app-region: no-drag; flex: none; width: 340px; height: 98px; margin-top: -30px; padding: 0 0 6px; border-style: solid; border-color: transparent; border-width: 0 117px;
    border-image: url("../ui2/boton_principal.webp") 0 270 fill / 0 117px stretch; background: none; cursor: pointer; color: #2e1a05; font: 900 34px/1 var(--f-title); letter-spacing: .16em;
    text-shadow: 0 1px 0 rgba(255,238,180,.8), 0 -1px 0 rgba(60,30,0,.3); filter: drop-shadow(0 8px 10px rgba(0,0,0,.75)); transition: filter .15s, transform .08s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .play small { font: 700 11px var(--f-text); letter-spacing: .06em; color: #5a3a10; text-shadow: none; text-transform: uppercase; }
  .play:not(:disabled) { animation: glow 2.2s ease-in-out infinite; }
  .play:hover:not(:disabled), .play:focus-visible:not(:disabled) { filter: brightness(1.12) drop-shadow(0 0 18px rgba(255,200,90,.85)) drop-shadow(0 8px 10px rgba(0,0,0,.75)); outline: none; animation: none; }
  .play:active:not(:disabled) { transform: translateY(3px) scale(.99); filter: brightness(.86) drop-shadow(0 3px 4px rgba(0,0,0,.8)); }
  .play:disabled { cursor: default; filter: grayscale(.85) brightness(.55) drop-shadow(0 8px 10px rgba(0,0,0,.75)); }
  @keyframes glow { 50% { filter: brightness(1.07) drop-shadow(0 0 16px rgba(255,200,90,.7)) drop-shadow(0 8px 10px rgba(0,0,0,.75)); } }

  /* ajustes */
  .pop { position: absolute; right: 410px; bottom: calc(var(--bar) - 6px); z-index: 10; width: 330px; padding: 4px 10px 8px; display: none; flex-direction: column; gap: 12px;
    border: 32px solid transparent; border-image: url("../ui2/ventana_marco_chico.webp") 250 / 32px stretch;
    background: linear-gradient(rgba(20,14,10,.95), rgba(13,9,6,.97)), url("../ui2/textura_piedra.webp") center/400px; background-origin: border-box; filter: drop-shadow(0 14px 24px rgba(0,0,0,.8)); }
  .pop.on { display: flex; animation: popin .25s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes popin { from { opacity: 0; transform: translateY(12px) scale(.97); } }
  .pop h3 { margin: -6px 0 2px; font: 700 15px var(--f-title); letter-spacing: .08em; color: var(--gold); text-transform: uppercase; text-align: center; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #e3d3b2; }
  .row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=checkbox] { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin: 0; flex: none; background: url("../ui2/casilla.webp") center/contain no-repeat; cursor: pointer; }
  input[type=checkbox]:checked { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'><path d='M6 13.5l4.5 4.5L20 7.5' fill='none' stroke='%23ffd77a' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/></svg>"), url("../ui2/casilla.webp"); }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 28px; margin: 0; background: none; border-style: solid; border-color: transparent; border-width: 0 20px; border-image: url("../ui2/barra_marco.webp") 0 200 fill / 0 24px stretch; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border: 0; background: url("../ui2/perilla.webp") center/contain no-repeat; filter: drop-shadow(0 2px 3px #000); }
  .pop .btn { --h: 40px; font-size: 13px; }

  /* entrada */
  .in1, .in2, .in3, .in4 { animation: rise .9s cubic-bezier(.2,.8,.25,1) both; }
  .in1 { animation-name: drop; } .in2 { animation-delay: .18s; } .in3 { animation-delay: .32s; animation-name: up; } .in4 { animation-delay: .5s; animation-name: up; }
  @keyframes drop { from { opacity: 0; transform: translateY(-24px); filter: blur(4px); } }
  @keyframes rise { from { opacity: 0; transform: translateX(-30px); } }
  @keyframes up { from { opacity: 0; transform: translateY(40px); } }
  @media (prefers-reduced-motion: reduce) {
    .in1, .in2, .in3, .in4, .play:not(:disabled), .prog .fill::after, .prog.ind .fill, .pop.on { animation: none !important; }
    .bg video { display: none; }
  }
  /* ventanas bajas o angostas (el zoom ya escala; esto es para formas raras) */
  @media (max-height: 640px) { .news { max-height: none; } }
</style>
</head>
<body>
<div class="bg"><video id="vid" muted loop playsinline preload="auto" poster="../ui2/menu_fondo_completo.webp"></video><canvas id="fx"></canvas></div>
<div class="vig"></div>
<header class="tb" id="tb"><span class="ttl">Thrones &amp; Siege</span><span class="sp"></span>
  <button id="wMin" title="Minimizar" aria-label="Minimizar"><svg viewBox="0 0 14 14"><path d="M2 7.5h10"/></svg></button>
  <button id="wMax" title="Maximizar" aria-label="Maximizar"><svg viewBox="0 0 14 14"><rect x="2.5" y="2.5" width="9" height="9"/></svg></button>
  <button id="wClose" class="x" title="Cerrar" aria-label="Cerrar"><svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
</header>
<main>
  <div class="logo in1"><h1>Thrones <span class="amp">&amp;</span> Siege</h1><p class="tag">Levantá tu castillo hasta 100 o derribá el del rival</p><div class="ver" id="ver"><i></i><span>Versión</span></div></div>
  <section class="news in2" aria-label="Novedades"><div class="ribbon" id="nTitle">Novedades</div><div class="body" id="notes"><p class="empty">Cargando…</p></div></section>
  <div class="pop" id="pop" role="dialog" aria-label="Ajustes del launcher">
    <h3>Ajustes</h3>
    <div class="row"><label><input type="checkbox" id="sAmb"> Sonido ambiente</label></div>
    <div class="row"><span>Volumen</span><input type="range" id="sVol" min="0" max="1" step="0.05"></div>
    <div class="row"><label><input type="checkbox" id="sVid"> Fondo animado</label></div>
    <div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap"><button class="btn" id="sCheck">Buscar actualización</button><button class="btn" id="sFolder">Carpeta del juego</button></div>
  </div>
  <footer class="bar in3">
    <div class="state">
      <div class="st-top"><span class="status" id="status" role="status">Buscando actualizaciones…</span><button class="btn retry" id="retry">Reintentar</button></div>
      <span class="detail" id="detail"></span>
      <div class="prog ind on" id="prog"><div class="trk"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div></div>
    </div>
    <div class="tools">
      <button class="g g-sonido" id="bSnd" title="Sonido ambiente" aria-pressed="false"></button>
      <button class="g g-ajustes" id="bSet" title="Ajustes" aria-expanded="false"></button>
      <button class="g g-carpeta" id="bFolder" title="Abrir la carpeta del juego"></button>
      <button class="g g-web" id="bWeb" title="Página de descargas"></button>
      <button class="g g-salir" id="bQuit" title="Salir"></button>
    </div>
    <button class="play in4" id="play" disabled>JUGAR<small id="playSub">Preparando</small></button>
  </footer>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const L = window.launcher || null;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PAGE = 'https://github.com/Neosailex/thrones-and-siege-releases/releases/latest';
  const store = { get(k, d) { try { const v = localStorage.getItem('ts-launcher-' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('ts-launcher-' + k, JSON.stringify(v)); } catch {} } };
  const mb = (n) => (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
  const esc = (s) => String(s).replace(/[<>&"]/g, (m) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[m]));

  /* escala proporcional al diseño 1280x800 (el zoom mantiene todo nítido) */
  const fit = () => document.documentElement.style.setProperty('--z', Math.max(0.68, Math.min(1.6, innerWidth / 1280, innerHeight / 800)).toFixed(4));
  addEventListener('resize', fit); fit();

  /* ventana: botones propios si la cáscara es sin marco */
  let INFO = {};
  const tb = $('tb');
  const win = (a) => L && L.win && L.win(a);
  $('wMin').onclick = () => win('min'); $('wMax').onclick = () => win('max'); $('wClose').onclick = () => (L && L.quit ? L.quit() : win('close'));
  tb.ondblclick = (e) => { if (!e.target.closest('button')) win('max'); };

  /* fondo animado + brasas */
  const vid = $('vid');
  function setVideo(on) {
    if (on && !RM) {
      if (!vid.src) { const ok = vid.canPlayType('video/webm; codecs="vp9"') || vid.canPlayType('video/webm'); vid.src = ok ? '../ui2/menu_fondo_vivo.webm' : '../ui2/menu_fondo_vivo.mp4'; }
      vid.play().then(() => vid.classList.add('on')).catch(() => {});
    } else { vid.classList.remove('on'); vid.pause(); vid.removeAttribute('src'); vid.load(); }
  }
  vid.addEventListener('error', () => { if (vid.src.endsWith('.webm')) { vid.src = '../ui2/menu_fondo_vivo.mp4'; vid.play().then(() => vid.classList.add('on')).catch(() => {}); } });
  const cv = $('fx'), g = cv.getContext('2d'); const P = []; let W = 0, H = 0, last = performance.now();
  const size = () => { const d = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); };
  addEventListener('resize', size); size();
  function frame(now) {
    requestAnimationFrame(frame); if (document.hidden || RM) return;
    const dt = Math.min(50, now - last); last = now;
    while (P.length < 38) P.push({ x: Math.random() * W, y: P.length < 19 ? Math.random() * H : H + 10, vx: (Math.random() - .5) * .12, vy: -(.25 + Math.random() * .5), r: .8 + Math.random() * 1.6, life: 0, max: 6000 + Math.random() * 6000, ph: Math.random() * 6, h: 20 + Math.random() * 22 });
    g.clearRect(0, 0, W, H);
    for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; p.life += dt; if (p.life > p.max || p.y < -20) { P.splice(i, 1); continue; } p.ph += dt * .002; p.x += (p.vx + Math.sin(p.ph) * .12) * dt * .06; p.y += p.vy * dt * .06;
      const a = p.life / p.max, al = Math.min(1, a * 6) * (1 - a) * .85, rr = p.r * 4, gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
      gr.addColorStop(0, `hsla(${p.h},100%,72%,${al})`); gr.addColorStop(.3, `hsla(${p.h},100%,55%,${al * .45})`); gr.addColorStop(1, `hsla(${p.h},100%,45%,0)`); g.fillStyle = gr; g.fillRect(p.x - rr, p.y - rr, rr * 2, rr * 2); }
  }
  requestAnimationFrame(frame);

  /* sonido ambiente (opcional, recuerda la elección) */
  const amb = new Audio(); amb.loop = true; amb.preload = 'none';
  const ambSrc = () => (amb.canPlayType('audio/ogg; codecs="vorbis"') ? '../ui2/menu_ambiente.ogg' : '../ui2/menu_ambiente.m4a');
  let sndOn = store.get('sound', true), vol = store.get('vol', 0.35), vidOn = store.get('video', true);
  function applySound() {
    $('bSnd').className = 'g ' + (sndOn ? 'g-sonido' : 'g-mudo'); $('bSnd').setAttribute('aria-pressed', sndOn ? 'false' : 'true'); $('bSnd').title = sndOn ? 'Silenciar el sonido ambiente' : 'Activar el sonido ambiente';
    $('sAmb').checked = sndOn; $('sVol').value = vol; amb.volume = vol;
    if (sndOn) { if (!amb.src) amb.src = ambSrc(); amb.play().catch(() => { const go = () => { if (sndOn) amb.play().catch(() => {}); }; addEventListener('pointerdown', go, { once: true }); }); } else amb.pause();
  }
  function releaseMedia() { amb.pause(); amb.removeAttribute('src'); amb.load(); setVideo(false); } // antes de instalar: Windows no deja mover archivos abiertos
  function restoreMedia() { setVideo(vidOn); if (sndOn) applySound(); }
  $('bSnd').onclick = () => { sndOn = !sndOn; store.set('sound', sndOn); applySound(); };
  $('sAmb').onchange = () => { sndOn = $('sAmb').checked; store.set('sound', sndOn); applySound(); };
  $('sVol').oninput = () => { vol = +$('sVol').value; store.set('vol', vol); amb.volume = vol; };
  $('sVid').checked = vidOn; $('sVid').onchange = () => { vidOn = $('sVid').checked; store.set('video', vidOn); setVideo(vidOn); };

  /* ajustes y herramientas */
  const pop = $('pop');
  $('bSet').onclick = (e) => { e.stopPropagation(); const on = pop.classList.toggle('on'); $('bSet').setAttribute('aria-expanded', on); };
  addEventListener('pointerdown', (e) => { if (pop.classList.contains('on') && !e.target.closest('#pop,#bSet')) { pop.classList.remove('on'); $('bSet').setAttribute('aria-expanded', 'false'); } });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') pop.classList.remove('on'); if (e.key === 'Enter' && !$('play').disabled && !e.target.closest('button,input')) $('play').click(); });
  const openFolder = () => L && L.openFolder && L.openFolder();
  $('bFolder').onclick = openFolder; $('sFolder').onclick = openFolder;
  if (!(L && L.openFolder)) { $('bFolder').hidden = true; $('sFolder').hidden = true; }
  $('bWeb').onclick = () => L && L.open && L.open(INFO.page || PAGE);
  $('bQuit').onclick = () => (L && L.quit ? L.quit() : win('close'));
  $('sCheck').onclick = () => { pop.classList.remove('on'); run(); };

  /* estados */
  const st = $('status'), det = $('detail'), prog = $('prog'), fill = $('fill'), knob = $('knob'), play = $('play'), sub = $('playSub'), retry = $('retry');
  function setState(text, { bad = false, detail = '', bar = null, canPlay = false, playText = 'JUGAR', playSub = '', retryOn = false } = {}) {
    st.textContent = text; st.classList.toggle('bad', bad); det.innerHTML = detail;
    prog.classList.toggle('on', bar !== null); prog.classList.toggle('ind', bar === 'ind');
    if (typeof bar === 'number') { const pc = Math.max(0, Math.min(100, bar)); fill.style.width = pc + '%'; knob.style.left = pc + '%'; knob.style.rotate = pc * 7.2 + 'deg'; }
    play.disabled = !canPlay; play.firstChild.textContent = playText; sub.textContent = playSub; retry.classList.toggle('on', retryOn);
    if (canPlay && !document.activeElement?.closest?.('button,input')) play.focus({ preventScroll: true });
  }
  function setVersion(v, kind = '') { const el = $('ver'); el.className = 'ver ' + kind; el.querySelector('span').textContent = 'Versión ' + v + (kind === 'off' ? ' · sin conexión' : kind === 'old' ? ' · hay una nueva' : ''); }
  function showNotes(version, text, current) {
    $('nTitle').textContent = version ? `Novedades ${version}` : 'Novedades';
    const items = String(text || '').split(/\n+/).map((s) => s.replace(/^[\s•\-*·]+/, '').trim()).filter(Boolean);
    $('notes').innerHTML = items.length ? `<ul>${items.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>` : '<p class="empty">Las novedades aparecen cuando hay conexión.</p>';
    $('notes').insertAdjacentHTML('beforeend', `<div class="sep"></div><p class="foot">Estás jugando la versión ${esc(current || '–')}</p>`);
  }
  // velocidad: promedio de los últimos segundos
  let samples = [];
  function speedOf(done) { const t = performance.now(); samples.push([t, done]); while (samples.length > 2 && t - samples[0][0] > 4000) samples.shift(); const [t0, d0] = samples[0]; return t - t0 > 300 ? ((done - d0) / (t - t0)) * 1000 : 0; }
  const secs = (s) => (s < 60 ? `${Math.ceil(s)} s` : `${Math.floor(s / 60)} min ${Math.ceil(s % 60)} s`);

  if (L && L.onProgress) L.onProgress((p) => {
    if (p.phase === 'download') {
      const pc = (p.done / (p.total || 1)) * 100, sp = speedOf(p.done), left = sp > 0 ? (p.total - p.done) / sp : 0;
      setState(`Descargando actualización… ${Math.floor(pc)}%`, { bar: pc, playText: 'JUGAR', playSub: 'Actualizando', detail: `<b>${mb(p.done)}</b> de ${mb(p.total)}${sp > 0 ? ` · <b>${mb(sp)}/s</b> · faltan ${secs(left)}` : ''}${p.files ? ` · ${p.got || 0}/${p.files} archivos` : ''}` });
    }
    if (p.phase === 'install') setState('Instalando…', { bar: 'ind', playSub: 'Instalando' });
  });

  play.onclick = () => { if (play.disabled) return; play.disabled = true; setState('Abriendo el juego…', { bar: 'ind', playSub: 'Abriendo' }); amb.pause(); L && L.play && L.play(); };
  retry.onclick = () => run();

  let busy = false;
  async function run() {
    if (busy || !L) return; busy = true; samples = [];
    setState('Buscando actualizaciones…', { bar: 'ind', playSub: 'Preparando' });
    let info = {}; try { info = (await L.info()) || {}; } catch {}
    INFO = info; const cur = info.current || '–'; setVersion(cur);
    let c;
    try { c = await L.check(); }
    catch (e) { busy = false; setVersion(cur, 'off'); showNotes(cur, info.notes || '', cur); return setState('Sin conexión', { detail: `Jugás con la versión ${esc(cur)}. Se vuelve a intentar la próxima vez.`, canPlay: true, playSub: 'Versión ' + cur, retryOn: true }); }
    showNotes(c.available ? c.latest : c.current || cur, c.notes, c.current || cur);
    if (!c.available) { busy = false; setVersion(c.current || cur); return setState('Tenés la última versión', { detail: 'Todo listo para la batalla.', canPlay: true, playSub: 'Versión ' + (c.current || cur) }); }
    if (c.needsShell) { busy = false; setVersion(cur, 'old'); return setState(`Hay una versión nueva (${c.latest})`, { detail: 'Necesita reinstalar el juego: bajala de la página de descargas (botón de la flecha).', canPlay: true, playSub: 'Versión ' + cur }); }
    setVersion(cur, 'old');
    setState(`Descargando actualización ${c.latest}…`, { bar: 0, playSub: 'Actualizando', detail: c.size ? `Hasta ${mb(c.size)}` : '' });
    releaseMedia();
    try {
      const r = await L.update();
      setVersion(r.version); restoreMedia();
      setState(`¡Actualizado a la versión ${r.version}!`, { bar: 100, canPlay: true, playSub: 'Versión ' + r.version, detail: r.downloaded ? `Se bajaron ${r.downloaded} archivo${r.downloaded > 1 ? 's' : ''} nuevo${r.downloaded > 1 ? 's' : ''}.` : '' });
    } catch (e) {
      restoreMedia();
      setState('No se pudo actualizar', { bad: true, detail: `${esc((e && e.message) || e || 'Error')} · Podés jugar la versión ${esc(cur)} o reintentar.`, canPlay: true, playSub: 'Versión ' + cur, retryOn: true });
    }
    busy = false;
  }

  // arranque
  if (!(L && L.win) || INFO.frameless === false) tb.classList.add('native');
  setVideo(vidOn); applySound();
  (async () => {
    try { INFO = (L && (await L.info())) || {}; } catch {}
    if (INFO.frameless) tb.classList.remove('native');
    try { L && L.ready && L.ready(); } catch {}
    if (L) run(); else setState('Vista previa del launcher', { detail: 'Sin la app de escritorio no hay actualizador.', canPlay: false });
  })();
})();
</script>
</body>
</html>
