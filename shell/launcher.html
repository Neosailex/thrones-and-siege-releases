<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Thrones &amp; Siege</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:">
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 700; src: url("app/fonts/cinzel-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: 'Cinzel'; font-weight: 900; src: url("app/fonts/cinzel-latin-900-normal.woff2") format("woff2"); }
  @font-face { font-family: 'Alegreya Sans'; font-weight: 500; src: url("app/fonts/alegreya-sans-latin-500-normal.woff2") format("woff2"); }
  :root { --gold: #e2b45a; --ink: #f1e6d0; --f-title: 'Cinzel', Georgia, serif; --f-text: 'Alegreya Sans', 'Segoe UI', Tahoma, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #120d0a; color: var(--ink); font: 500 16px/1.4 var(--f-text); overflow: hidden; user-select: none; }
  /* fondo: ui2/fondo_launcher (si falta, la imagen de siempre) */
  .bg { position: fixed; inset: -2%; background: url("app/ui2/fondo_launcher.webp") center/cover no-repeat, url("app/menu-bg.jpg") center/cover no-repeat; filter: brightness(.78) saturate(1.05); animation: drift 40s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: scale(1.05) translate(-1%, -.5%); } }
  .shade { position: fixed; inset: 0; background: radial-gradient(ellipse 70% 65% at 50% 45%, transparent 35%, #000c 100%), linear-gradient(180deg, #0008, transparent 30%, transparent 70%, #000a); }
  main { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; }
  h1 { margin: 0; font: 900 clamp(40px, 6.4vw, 84px)/1 var(--f-title); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap;
    background: linear-gradient(180deg, #fffbe6 0%, #fbe39a 18%, #e9b65a 40%, #a8691f 49%, #6e410f 52%, #b9822f 60%, #f2cb72 80%, #fff0c0 90%, #a8742a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1.2px rgba(70,38,8,.9); filter: drop-shadow(0 -1px 0 rgba(255,244,205,.55)) drop-shadow(0 2px 0 #3a2007) drop-shadow(0 4px 3px #000c) drop-shadow(0 0 24px rgba(255,180,80,.3)); }
  h1 .amp { font-size: .6em; vertical-align: .2em; font-weight: 700; }
  .ver { color: #dccaa5; font: 700 14px var(--f-title); letter-spacing: .08em; text-shadow: 0 1px 3px #000; margin-bottom: 8px; }
  .panel { width: min(600px, 92vw); display: flex; flex-direction: column; gap: 14px; padding: 8px 20px 4px;
    border: 46px solid transparent; border-image: url("app/ui2/ventana_marco_chico.webp") 250 / 46px stretch;
    background: linear-gradient(rgba(20,14,10,.86), rgba(13,9,6,.92)), url("app/ui2/textura_piedra.webp") center/480px; background-origin: border-box; filter: drop-shadow(0 18px 30px #000d); }
  .status { font-size: 18px; min-height: 24px; text-align: center; text-shadow: 0 1px 2px #000; }
  .bar { height: 30px; display: none; border-style: solid; border-color: transparent; border-width: 0 26px; border-image: url("app/ui2/barra_marco.webp") 0 200 fill / 0 26px stretch; padding: 9px 0; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(180deg, #ffe7a0, #e2b45a 50%, #9a6a22); box-shadow: 0 0 10px #ffcb6a99; transition: width .2s; }
  .notes { display: none; font-size: 15px; color: #e3d5b8; background: #0008; border: 1px solid #b0884a55; padding: 10px 14px; max-height: 150px; overflow: auto; white-space: pre-line; }
  .notes b { color: var(--gold); display: block; margin-bottom: 4px; font-family: var(--f-title); letter-spacing: .04em; }
  button.play { align-self: center; min-width: 320px; height: 78px; padding: 0 10px 4px; border-style: solid; border-color: transparent; border-width: 0 94px; cursor: pointer; background: none;
    border-image: url("app/ui2/boton_principal.webp") 0 270 fill / 0 94px stretch; font: 900 30px/1 var(--f-title); letter-spacing: .14em; color: #2e1a05; text-shadow: 0 1px 0 rgba(255,238,180,.75);
    filter: drop-shadow(0 5px 6px #000b); transition: filter .14s, transform .08s; }
  button.play:hover:not(:disabled), button.play:focus-visible { filter: brightness(1.12) drop-shadow(0 0 14px rgba(255,200,90,.8)) drop-shadow(0 5px 6px #000b); outline: none; }
  button.play:active:not(:disabled) { transform: translateY(3px); filter: brightness(.88); }
  button.play:disabled { filter: grayscale(.85) brightness(.6); cursor: default; }
  button.play:not(:disabled) { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 50% { filter: brightness(1.08) drop-shadow(0 0 16px rgba(255,200,90,.75)) drop-shadow(0 5px 6px #000b); } }
  .small { font-size: 14px; color: #b9a886; text-align: center; min-height: 18px; }
  a { color: var(--gold); }
  /* respaldo: barra de título propia cuando la ventana no tiene marco */
  .tb { position: fixed; top: 0; left: 0; right: 0; height: 34px; display: none; align-items: center; padding: 0 6px 0 14px; z-index: 5; -webkit-app-region: drag; font: 700 12px var(--f-title); letter-spacing: .14em; color: #bfa77a; text-transform: uppercase; }
  .tb.on { display: flex; } .tb i { flex: 1; }
  .tb button { -webkit-app-region: no-drag; width: 40px; height: 28px; border: 0; background: none; color: #d9be86; font-size: 15px; cursor: pointer; border-radius: 4px; }
  .tb button:hover { background: rgba(226,180,90,.18); } .tb button.x:hover { background: #8a1d12; color: #fff; }
  @media (prefers-reduced-motion: reduce) { .bg, button.play:not(:disabled) { animation: none; } }
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div>
<div class="tb" id="tb"><span>Thrones &amp; Siege</span><i></i><button id="wMin" title="Minimizar">&#8211;</button><button id="wClose" class="x" title="Cerrar">&#10005;</button></div>
<main>
  <h1>Thrones <span class="amp">&amp;</span> Siege</h1>
  <div class="ver" id="ver"></div>
  <div class="panel">
    <div class="status" id="status">Buscando actualizaciones…</div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="notes" id="notes"></div>
    <button class="play" id="play" disabled>JUGAR</button>
    <div class="small" id="small"></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const L = window.launcher;
  if (L && L.win) { $('tb').classList.add('on'); $('wMin').onclick = () => L.win('min'); $('wClose').onclick = () => (L.quit ? L.quit() : L.win('close')); }
  const mb = (n) => (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
  function ready(text, small = '') { $('status').textContent = text; $('small').innerHTML = small; $('play').disabled = false; $('play').focus(); }
  $('play').onclick = () => { $('play').disabled = true; $('status').textContent = 'Abriendo…'; L.play(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('play').disabled) $('play').click(); });
  L.onProgress((p) => {
    if (p.phase === 'download') { $('bar').style.display = 'block'; const pct = Math.round((p.done / p.total) * 100); $('fill').style.width = pct + '%'; $('status').textContent = `Descargando actualización… ${pct}%  (${mb(p.done)} de ${mb(p.total)})`; }
    if (p.phase === 'install') $('status').textContent = 'Instalando…';
  });
  (async () => {
    const info = await L.info(); $('ver').textContent = 'Versión ' + info.current;
    let c;
    try { c = await L.check(); } catch (e) { return ready('Sin conexión: jugás con la versión ' + info.current, 'No se pudo buscar actualizaciones. Se va a intentar de nuevo la próxima vez.'); }
    if (c.notes) { $('notes').style.display = 'block'; $('notes').innerHTML = `<b>Novedades ${c.latest}</b>${c.notes.replace(/[<>&]/g, (m) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m]))}`; }
    if (!c.available) return ready('Tenés la última versión');
    if (c.needsShell) return ready(`Hay una versión nueva (${c.latest}) que necesita reinstalar el juego`, `Bajala de <a href="#" id="pg">la página de descargas</a>. Mientras tanto podés jugar la versión ${c.current}.`), ($('pg').onclick = (e) => { e.preventDefault(); L.open(c.page); });
    try {
      const r = await L.update();
      $('ver').textContent = 'Versión ' + r.version; $('fill').style.width = '100%';
      ready('¡Actualizado a la versión ' + r.version + '!', r.downloaded ? `Se bajaron ${r.downloaded} archivo${r.downloaded > 1 ? 's' : ''} nuevos.` : '');
    } catch (e) { ready('No se pudo actualizar: jugás con la versión ' + c.current, 'Se va a intentar de nuevo la próxima vez.'); }
  })();
</script>
</body>
</html>
